# Render Blueprint: the Docker backend from this repo (the frontend is on Vercel, see the note at the end).
# Secrets use `sync: false`, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: cotizaia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: LLM_PROVIDER
        value: groq
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      # Frontend URL, e.g. https://cotizaia-frontend.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LLM_CHAIN
        value: gemini,groq
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_ENABLED
        sync: false
      - key: GMAIL_AGENCY_ID
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      # Spec 16: email. Off by default; the dashboard holds the credentials (sync:false).
      - key: MAIL_ENABLED
        value: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_STARTTLS
        value: true
      - key: MAIL_VERIFICATION_REQUIRED
        value: false
      - key: MAIL_SEND_TO_CLIENT
        value: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      # WhatsApp assistant: the key "npm run iniciar" prints in whatsapp-service/; the link defaults to APP_PUBLIC_URL.
      - key: WHATSAPP_SERVICE_KEY
        sync: false
      - key: WHATSAPP_SITE_URL
        sync: false
      # The linked number shown in the app, e.g. +573010944197.
      - key: WHATSAPP_BOT_NUMBER
        sync: false

  # The frontend is deployed on Vercel, not here: frontend-cotizaIA/vercel.json proxies /api/* to this service
  # (same origin for the SameSite=Strict session cookies) and sends the CSP and security headers.
