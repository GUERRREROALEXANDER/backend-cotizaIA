# Render Blueprint: the Docker backend from this repo plus the Vite frontend as a static site.
# Secrets use `sync: false`, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: cotizaia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: LLM_PROVIDER
        value: groq
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Frontend URL, e.g. https://cotizaia-frontend.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Static sites are free and don't sleep. VITE_API_URL is read at build time,
  # so redeploy the frontend after changing it.
  - type: web
    name: cotizaia-frontend
    runtime: static
    repo: https://github.com/GUERRREROALEXANDER/frontend-cotizaIA
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Backend URL, e.g. https://cotizaia-backend.onrender.com (no trailing slash).
      - key: VITE_API_URL
        sync: false
