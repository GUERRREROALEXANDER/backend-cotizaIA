# Render Blueprint: the Docker backend from this repo (the frontend is on Vercel, see the note at the end).
# Secrets use `sync: false`, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: cotizaia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: LLM_PROVIDER
        value: groq
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      # Frontend URL, e.g. https://cotizaia-frontend.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # The frontend is deployed on Vercel, not here: frontend-cotizaIA/vercel.json proxies /api/* to this service
  # (same origin for the SameSite=Strict session cookies) and sends the CSP and security headers.
