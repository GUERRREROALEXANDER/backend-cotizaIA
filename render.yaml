# Render Blueprint: the Docker backend from this repo plus the Vite frontend as a static site.
# Secrets use `sync: false`, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: cotizaia-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: LLM_PROVIDER
        value: groq
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      # Frontend URL, e.g. https://cotizaia-frontend.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Static sites are free and don't sleep. VITE_API_URL is read at build time,
  # so redeploy the frontend after changing it.
  - type: web
    name: cotizaia-frontend
    runtime: static
    repo: https://github.com/GUERRREROALEXANDER/frontend-cotizaIA
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # The browser only talks to this origin: /api/* is proxied to the backend, so the session cookies stay
    # first-party (SameSite=Strict) and no API URL is baked into the bundle. Replace the host if Render gave the
    # backend a suffixed URL.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cotizaia-backend.onrender.com/api/*
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
