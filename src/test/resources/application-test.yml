spring:
  datasource:
    url: jdbc:h2:mem:cotizaia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
llm:
  provider: stub

security:
  # Every test registers from 127.0.0.1 in a shared context; limits are exercised only by RateLimitTests.
  rate-limit:
    enabled: false
  jwt:
    secret: cotizaia-test-only-secret-never-use-in-production

# Test-only keys (32 bytes each, base64). Production keys come from the environment, never from files.
crypto:
  active-key-id: k1
  keys:
    k1: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
  blind-index-key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
