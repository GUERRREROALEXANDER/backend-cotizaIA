# =============================================================================
# CotizaIA backend - production profile (Render web service + Supabase Postgres)
# =============================================================================
# Activated with SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile and render.yaml).
# Every secret comes from the environment; nothing here is a credential.
# REQUIRED in prod: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, GROQ_API_KEY.
# =============================================================================

spring:
  datasource:
    # No defaults on purpose: a missing variable fails fast at startup instead of
    # silently pointing at a local database.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Supabase's free pooler accepts few connections; keep the pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000

server:
  # Render terminates TLS at its proxy and forwards X-Forwarded-* headers, so
  # getRemoteAddr() is the real client and rate-limit keys stay per client.
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    # Never leak stack traces, exception messages or class names to clients.
    include-stacktrace: never
    include-message: never

llm:
  provider: ${LLM_PROVIDER:groq}

knowledge:
  # Supabase Postgres ships the pgvector extension, enabled by vendor
  # migration V24; the accelerated store replaces the portable scan.
  vector-store: pgvector

springdoc:
  # API docs are a development surface, not a production one: expose them only
  # when SWAGGER_ENABLED=true is set on purpose.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # Only the public health probe; env, beans, loggers, etc. stay closed.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
