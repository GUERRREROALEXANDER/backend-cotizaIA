spring:
  application:
    name: backend-cotizaia
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cotizaia}
    username: ${SPRING_DATASOURCE_USERNAME:cotizaia}
    password: ${SPRING_DATASOURCE_PASSWORD:cotizaia}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}

pricing:
  fixed-risk-buffer: ${PRICING_FIXED_RISK_BUFFER:0.20}
  phased-coordination-overhead: ${PRICING_PHASED_OVERHEAD:0.10}

pipeline:
  default-hours: ${PIPELINE_DEFAULT_HOURS:8}
  hours-per-week: ${PIPELINE_HOURS_PER_WEEK:40}

llm:
  provider: ${LLM_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    api-key: ${OLLAMA_API_KEY:}
    model: ${OLLAMA_MODEL:llama3.1}
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    # 120b with low reasoning: exact on the seed extraction tasks at ~1K tokens per call (free tier: 8K/min, 200K/day).
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    reasoning-effort: ${GROQ_REASONING_EFFORT:low}
  # Google's OpenAI-compatible endpoint (Gemma 4, free tier). Used through llm.chain; the key is per Google Cloud project.
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemma-4-31b-it}
    reasoning-effort: ${GEMINI_REASONING_EFFORT:}
  # Failover order, e.g. "gemini,groq": the next provider answers when one is out of quota or down. Blank = only
  # llm.provider. Embeddings still follow llm.provider (use groq with a chain).
  chain: ${LLM_CHAIN:}
  timeout:
    connect: ${LLM_CONNECT_TIMEOUT:5s}
    read: ${LLM_READ_TIMEOUT:60s}
  retry:
    max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:4}
    initial-backoff: ${LLM_RETRY_INITIAL_BACKOFF:500ms}
    multiplier: ${LLM_RETRY_MULTIPLIER:2.0}
    max-backoff: ${LLM_RETRY_MAX_BACKOFF:60s}
  # Only with llm.chain: a provider that has a successor is skipped for open-duration after failure-threshold
  # consecutive failed requests, then one trial call decides. The last provider is never skipped.
  circuit-breaker:
    enabled: ${LLM_CIRCUIT_BREAKER_ENABLED:true}
    failure-threshold: ${LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
    open-duration: ${LLM_CIRCUIT_BREAKER_OPEN_DURATION:60s}

embedding:
  voyage:
    base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
    api-key: ${VOYAGE_API_KEY:}
    model: ${VOYAGE_MODEL:voyage-4-lite}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
  batch-size: ${EMBEDDING_BATCH_SIZE:64}
  cache-size: ${EMBEDDING_CACHE_SIZE:10000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL_EMBED:nomic-embed-text}

knowledge:
  # Where past-proposal embeddings live: portable exact scan (jdbc, default)
  # or the pgvector index (see db/migration and db/vendor/{vendor}).
  vector-store: ${KNOWLEDGE_VECTOR_STORE:jdbc}

# Spec 11: Gmail intake. Off unless GMAIL_ENABLED=true; secrets only from the environment.
gmail:
  enabled: ${GMAIL_ENABLED:false}
  mailbox: ${GMAIL_MAILBOX:}
  label: ${GMAIL_LABEL:cotizar}
  agency-id: ${GMAIL_AGENCY_ID:}
  poll-interval: ${GMAIL_POLL_INTERVAL:PT1M}
  scheduler-enabled: ${GMAIL_SCHEDULER_ENABLED:true}
  create-unknown-senders: ${GMAIL_CREATE_UNKNOWN_SENDERS:true}
  auto-process: ${GMAIL_AUTO_PROCESS:true}
  max-messages-per-run: ${GMAIL_MAX_MESSAGES_PER_RUN:20}
  oauth:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
  push:
    enabled: ${GMAIL_PUSH_ENABLED:false}
    topic: ${GMAIL_PUSH_TOPIC:}
    audience: ${GMAIL_PUSH_AUDIENCE:}
    service-account-email: ${GMAIL_PUSH_SERVICE_ACCOUNT:}

security:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: cotizaia

# Spec 16: account verification and document delivery. Off unless MAIL_ENABLED=true; secrets only
# from the environment. With mail off the no-op adapter is wired and nothing leaves the process.
mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:no-reply@cotizaia.local}
  starttls: ${MAIL_STARTTLS:true}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  verification-required: ${MAIL_VERIFICATION_REQUIRED:false}
  send-to-client: ${MAIL_SEND_TO_CLIENT:false}

# WhatsApp notices. The backend only writes an outbox; the Node service in whatsapp-service/ sends it from a linked
# WhatsApp number. Off until WHATSAPP_SERVICE_KEY is set (32+ characters, the same value in whatsapp-service/.env):
# without it the outbox endpoints answer 503.
whatsapp:
  service-key: ${WHATSAPP_SERVICE_KEY:}
  notice-lifetime: ${WHATSAPP_NOTICE_LIFETIME:PT1H}
  # The assistant (prompt in whatsapp/asistente-prompt.txt) answers whoever writes to the linked number with the
  # LLM chain above and sends them to this page for their quotation (default: the frontend, APP_PUBLIC_URL). It never
  # quotes prices or dates.
  site-url: ${WHATSAPP_SITE_URL:${APP_PUBLIC_URL:}}
  # The number the WhatsApp service is linked to (+57...), shown in the app so users know where to write.
  bot-number: ${WHATSAPP_BOT_NUMBER:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

crypto:
  active-key-id: ${DATA_ENCRYPTION_KEY_ID:k1}
  keys:
    k1: ${DATA_ENCRYPTION_KEY}
  blind-index-key: ${BLIND_INDEX_KEY}

management:
  endpoints:
    web:
      exposure:
        # Only health (public, Render's probe) and info (token required) are exposed; env, beans, etc. stay off.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: backend-cotizaia
    description: CotizaIA quotation agent API

# Demo agency (com.cotizaia.demo.DemoSeeder): DEMO_SEED=true loads "Estudio Nariño Digital" once on startup,
# through the same services as the API, and only into a database with no agencies yet (otherwise it does nothing,
# whatever DEMO_EMAIL says). Off by default.
demo:
  seed: ${DEMO_SEED:false}
  email: ${DEMO_EMAIL:demo@estudio-narino.test}
  password: ${DEMO_PASSWORD:CotizaIA-demo-2026}