spring:
  application:
    name: backend-cotizaia
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cotizaia}
    username: ${SPRING_DATASOURCE_USERNAME:cotizaia}
    password: ${SPRING_DATASOURCE_PASSWORD:cotizaia}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}

pricing:
  fixed-risk-buffer: ${PRICING_FIXED_RISK_BUFFER:0.20}
  phased-coordination-overhead: ${PRICING_PHASED_OVERHEAD:0.10}

pipeline:
  default-hours: ${PIPELINE_DEFAULT_HOURS:8}
  hours-per-week: ${PIPELINE_HOURS_PER_WEEK:40}

llm:
  provider: ${LLM_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  timeout:
    connect: ${LLM_CONNECT_TIMEOUT:5s}
    read: ${LLM_READ_TIMEOUT:60s}
  retry:
    max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
    initial-backoff: ${LLM_RETRY_INITIAL_BACKOFF:500ms}
    multiplier: ${LLM_RETRY_MULTIPLIER:2.0}

embedding:
  voyage:
    base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
    api-key: ${VOYAGE_API_KEY:}
    model: ${VOYAGE_MODEL:voyage-4-lite}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}
  batch-size: ${EMBEDDING_BATCH_SIZE:64}
  cache-size: ${EMBEDDING_CACHE_SIZE:10000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL_EMBED:nomic-embed-text}

security:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: cotizaia

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

crypto:
  active-key-id: ${DATA_ENCRYPTION_KEY_ID:k1}
  keys:
    k1: ${DATA_ENCRYPTION_KEY}
  blind-index-key: ${BLIND_INDEX_KEY}

management:
  endpoints:
    web:
      exposure:
        # Only health (public, Render's probe) and info (token required) are exposed; env, beans, etc. stay off.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: backend-cotizaia
    description: CotizaIA quotation agent API
